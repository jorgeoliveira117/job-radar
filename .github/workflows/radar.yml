name: Job Radar
on:
  schedule:
    - cron: "17 7 * * 1-5" # weekdays 07:17 UTC (~08:17 Lisbon); avoid :00 scheduler congestion
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npx tsx src/index.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OUTPUT_GITHUB_REPOSITORY:
          OUTPUT_GITHUB_TOKEN: ${{ secrets.JOB_RADAR_OUTPUT_TOKEN }}
      - name: Persist seen jobs
        run: |
          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "chore: update seen jobs"
          git push
